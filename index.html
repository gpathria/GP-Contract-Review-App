<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></svg>
      </span>
      <span class="brand-name">Contract Review</span>
    </div>
    <div class="topbar-right">
      <span id="file-name" class="file-name" hidden></span>
      <button id="replace-btn" type="button" class="btn-ghost" hidden>Upload new contract</button>
    </div>
  </header>

  <main class="layout">
    <!-- Left: contract -->
    <section class="panel" aria-label="Contract">
      <div class="panel-head">
        <h2>Contract</h2>
        <span id="file-meta" class="meta"></span>
      </div>

      <div class="panel-body">
        <label id="dropzone" class="dropzone" for="file-input">
          <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
          <span class="dz-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>
          </span>
          <span class="dz-main">Drop your PDF contract here</span>
          <span class="dz-sub">or <span class="link">browse files</span> · PDF only</span>
          <span id="upload-error" class="upload-error" role="alert"></span>
        </label>

        <div id="viewer" class="viewer" hidden>
          <iframe id="pdf-frame" title="Contract PDF preview"></iframe>
        </div>
      </div>
    </section>

    <!-- Right: chat -->
    <section class="panel" aria-label="Chat">
      <div class="panel-head">
        <h2><span class="dot" aria-hidden="true"></span>Ask about this contract</h2>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="msg bot">Hi! Upload a contract, then ask me anything about it.</div>
      </div>

      <div class="suggestions" id="suggestions">
        <button type="button" class="chip">Summarize the key obligations</button>
        <button type="button" class="chip">What are the termination terms?</button>
        <button type="button" class="chip">Is there an auto-renewal clause?</button>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="sr-only">Your question</label>
        <input id="chat-input" type="text" placeholder="Type your question…">
        <button id="send-btn" type="submit" class="btn-primary" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
